name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "projects/changxing/hourly_2025.csv"
      - "projects/changxing/charging_2025/charging_hourly_2025.csv"
      - "projects/changxing/pv_2025/pv_hourly_2025.csv"
      - "projects/changxing/ecm/ecm_results.csv"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data.json from the committed result files
        run: python site/build_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
